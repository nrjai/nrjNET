<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="nrjNET - my first neural network, built from scratch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2ff"/>
      <stop offset="55%" stop-color="#f0ebff"/>
      <stop offset="100%" stop-color="#e6fbf3"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5fa2"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="260" rx="28" fill="url(#bg)"/>

  <!-- little network on the right: 3 -> 4 -> 4 -> 1 -->
  <g stroke="#c4b5fd" stroke-width="1.4" opacity="0.9">
    <!-- input -> h1 -->
    <line x1="600" y1="85" x2="680" y2="70"/><line x1="600" y1="85" x2="680" y2="110"/><line x1="600" y1="85" x2="680" y2="150"/><line x1="600" y1="85" x2="680" y2="190"/>
    <line x1="600" y1="130" x2="680" y2="70"/><line x1="600" y1="130" x2="680" y2="110"/><line x1="600" y1="130" x2="680" y2="150"/><line x1="600" y1="130" x2="680" y2="190"/>
    <line x1="600" y1="175" x2="680" y2="70"/><line x1="600" y1="175" x2="680" y2="110"/><line x1="600" y1="175" x2="680" y2="150"/><line x1="600" y1="175" x2="680" y2="190"/>
    <!-- h1 -> h2 -->
    <line x1="680" y1="70" x2="760" y2="70"/><line x1="680" y1="70" x2="760" y2="110"/><line x1="680" y1="70" x2="760" y2="150"/><line x1="680" y1="70" x2="760" y2="190"/>
    <line x1="680" y1="110" x2="760" y2="70"/><line x1="680" y1="110" x2="760" y2="110"/><line x1="680" y1="110" x2="760" y2="150"/><line x1="680" y1="110" x2="760" y2="190"/>
    <line x1="680" y1="150" x2="760" y2="70"/><line x1="680" y1="150" x2="760" y2="110"/><line x1="680" y1="150" x2="760" y2="150"/><line x1="680" y1="150" x2="760" y2="190"/>
    <line x1="680" y1="190" x2="760" y2="70"/><line x1="680" y1="190" x2="760" y2="110"/><line x1="680" y1="190" x2="760" y2="150"/><line x1="680" y1="190" x2="760" y2="190"/>
    <!-- h2 -> out -->
    <line x1="760" y1="70" x2="835" y2="130"/><line x1="760" y1="110" x2="835" y2="130"/><line x1="760" y1="150" x2="835" y2="130"/><line x1="760" y1="190" x2="835" y2="130"/>
  </g>
  <g stroke="#ffffff" stroke-width="3">
    <circle cx="600" cy="85" r="11" fill="#ff8fc0"/><circle cx="600" cy="130" r="11" fill="#ff8fc0"/><circle cx="600" cy="175" r="11" fill="#ff8fc0"/>
    <circle cx="680" cy="70" r="11" fill="#a78bfa"/><circle cx="680" cy="110" r="11" fill="#a78bfa"/><circle cx="680" cy="150" r="11" fill="#a78bfa"/><circle cx="680" cy="190" r="11" fill="#a78bfa"/>
    <circle cx="760" cy="70" r="11" fill="#a78bfa"/><circle cx="760" cy="110" r="11" fill="#a78bfa"/><circle cx="760" cy="150" r="11" fill="#a78bfa"/><circle cx="760" cy="190" r="11" fill="#a78bfa"/>
    <circle cx="835" cy="130" r="14" fill="#34d399"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffb3d4">
    <path d="M520 46 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
    <path d="M858 210 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#c4b5fd"/>
    <path d="M70 205 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#86efac"/>
  </g>

  <!-- text -->
  <text x="64" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" fill="url(#title)" letter-spacing="-1">nrjNET</text>
  <text x="68" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#3b3355">my first neural network 🧠</text>
  <text x="68" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b6386">built from scratch · pure Python · zero frameworks</text>
</svg>
