[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nrjnet"
version = "0.1.0"
description = "nrjNET - my first neural network, built from scratch in pure Python"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []  # the core library needs nothing but Python itself

[project.optional-dependencies]
viz = ["graphviz"]
notebook = ["numpy", "matplotlib", "graphviz", "jupyter"]
test = ["torch"]

[tool.setuptools]
packages = ["nrjnet"]
